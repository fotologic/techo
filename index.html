<style>
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,

.leaflet-tile-container,

	}

}

<style>
  :root{
    --paper:#E7E3D9; --paper2:#EFEBE3; --card:#F3F0E9;
    --ink:#1C1813; --muted:#7A736A; --faint:#9B948A;
    --rule:rgba(28,24,19,.13); --rule2:rgba(28,24,19,.22);
    --indigo:#2B3E5C; --indigo-d:#1B2434; --vermilion:#A2472F;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Zen Kaku Gothic New",system-ui,sans-serif;font-size:16px;line-height:1.5;
    -webkit-font-smoothing:antialiased;}
  .wrap{max-width:620px;margin:0 auto;}
  header{background:var(--indigo-d);color:var(--paper);padding:26px 20px 20px;position:relative;overflow:hidden;}
  .brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
  .brand h1{font-family:"Shippori Mincho",serif;font-weight:800;font-size:32px;letter-spacing:.02em;margin:0;line-height:1;}
  .brand .kanji{font-family:"Shippori Mincho",serif;font-weight:500;font-size:26px;color:rgba(231,227,217,.55);letter-spacing:.1em;}
  header .tag{font-size:13.5px;color:rgba(231,227,217,.8);margin:8px 0 14px;}
  header .base{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.04em;
    color:rgba(231,227,217,.62);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .hchip{border:1px solid rgba(231,227,217,.3);border-radius:2px;padding:1px 6px;}

  .controls{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);padding:12px 20px 10px;}
  .dbar{position:relative;margin-bottom:11px;}
  .dbar::after{content:"\203A";position:absolute;right:13px;top:50%;transform:translateY(-55%) rotate(90deg);
    color:var(--muted);pointer-events:none;font-family:"IBM Plex Mono",monospace;font-size:16px;}
  select#district{width:100%;font-family:"Shippori Mincho",serif;font-weight:600;font-size:16px;color:var(--ink);
    background:var(--paper2);border:1px solid var(--rule2);border-radius:3px;padding:10px 34px 10px 12px;
    min-height:42px;-webkit-appearance:none;appearance:none;}
  .today{font-size:13px;color:var(--muted);margin:0 0 10px;line-height:1.45;}
  .today b{color:var(--ink);font-weight:700;} .today .warn{color:var(--vermilion);font-weight:700;}
  .rowline{display:flex;gap:8px;align-items:center;margin-bottom:9px;flex-wrap:wrap;}
  .seg{display:inline-flex;border:1px solid var(--rule2);border-radius:3px;overflow:hidden;}
  .seg button{font-family:"Zen Kaku Gothic New";font-size:13px;font-weight:500;border:0;background:transparent;
    color:var(--muted);padding:6px 13px;cursor:pointer;border-right:1px solid var(--rule2);min-height:36px;}
  .seg button:last-child{border-right:0;}
  .seg button[aria-pressed="true"]{background:var(--indigo);color:#fff;}
  .toggle{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.03em;color:var(--muted);
    display:inline-flex;align-items:center;gap:7px;cursor:pointer;border:1px solid var(--rule2);border-radius:3px;padding:6px 10px;min-height:36px;}
  .toggle[aria-pressed="true"]{background:var(--indigo);color:#fff;border-color:var(--indigo);}
  .toggle .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.55;}
  .toggle[aria-pressed="true"] .dot{opacity:1;}
  input.search{width:100%;font-family:"Zen Kaku Gothic New";font-size:14px;color:var(--ink);background:var(--paper2);
    border:1px solid var(--rule2);border-radius:3px;padding:8px 11px;min-height:36px;}
  input.search::placeholder{color:var(--faint);}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;}
  .chip{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;
    border:1px solid var(--rule2);border-radius:2px;padding:3px 8px 3px 7px;cursor:pointer;color:var(--muted);
    background:transparent;display:inline-flex;align-items:center;gap:6px;line-height:1.4;}
  .chip .cdot{width:8px;height:8px;border-radius:50%;flex:none;}
  .chip[aria-pressed="false"]{opacity:.4;text-decoration:line-through;}

  .daybar{display:flex;gap:6px;overflow-x:auto;margin-bottom:11px;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .daybar::-webkit-scrollbar{display:none;}
  .day{flex:none;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.02em;border:1px solid var(--rule2);border-radius:3px;padding:5px 10px;cursor:pointer;color:var(--muted);background:transparent;white-space:nowrap;min-height:32px;}
  .day[aria-pressed="true"]{background:var(--indigo);color:#fff;border-color:var(--indigo);}
  .listhead{display:flex;align-items:baseline;justify-content:space-between;padding:14px 20px 4px;}
  .listhead .count{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;}
  .listhead .sort{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--indigo);background:none;border:0;cursor:pointer;letter-spacing:.04em;}
  ul.list{list-style:none;margin:0;padding:6px 12px 40px;}
  .card{background:var(--card);border:1px solid var(--rule);border-radius:4px;margin:8px 0;display:flex;overflow:hidden;}
  .card.closed{opacity:.62;}
  .spine{width:5px;flex:none;}
  .body{flex:1;min-width:0;}
  .head{width:100%;text-align:left;background:none;border:0;cursor:pointer;padding:13px 14px 12px;display:block;font-family:inherit;color:inherit;}
  .nl{display:flex;align-items:baseline;gap:8px;}
  .nm{font-family:"Shippori Mincho",serif;font-weight:700;font-size:17.5px;color:var(--ink);line-height:1.2;}
  .jp{font-family:"Shippori Mincho",serif;font-weight:500;font-size:13px;color:var(--faint);white-space:nowrap;}
  .caret{margin-left:auto;color:var(--faint);font-family:"IBM Plex Mono",monospace;font-size:18px;line-height:1;
    flex:none;display:inline-block;opacity:.7;transition:transform .18s ease;}
  .card.open .caret{transform:rotate(90deg);}
  .meta{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.02em;color:var(--muted);
    margin:6px 0 0;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;}
  .cat{font-weight:500;}
  .fl{border:1px solid var(--rule2);border-radius:2px;padding:0 5px;}
  .fl.avoid,.fl.closedt{color:var(--vermilion);border-color:rgba(162,71,47,.4);}
  .stn{display:inline-flex;align-items:center;gap:5px;}
  .code{font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:10px;letter-spacing:.02em;padding:1px 5px;border-radius:3px;line-height:1.5;}
  .code.plain{background:transparent;color:var(--muted);border:1px solid var(--rule2);}
  .stnm{color:var(--muted);}
  .desc{font-size:13.5px;color:var(--ink);opacity:.85;margin:8px 0 0;line-height:1.5;}
  .detail{padding:0 14px 14px;border-top:1px dashed var(--rule);margin-top:11px;}
  .detail[hidden]{display:none;}
  .drow{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);margin-top:10px;letter-spacing:.02em;}
  .drow b{color:var(--ink);font-weight:500;}
  .links{margin-top:12px;display:flex;gap:9px;flex-wrap:wrap;}
  .links a{font-family:"Zen Kaku Gothic New";font-size:12.5px;font-weight:500;text-decoration:none;color:var(--indigo);
    border:1px solid var(--indigo);border-radius:3px;padding:6px 11px;display:inline-block;}
  .links a.ghost{color:var(--muted);border-color:var(--rule2);}
  .ext{font-size:14px;opacity:.6;margin-left:3px;font-family:"IBM Plex Mono",monospace;vertical-align:-1px;}
  .empty{text-align:center;color:var(--muted);font-size:14px;padding:44px 20px;}
  .empty b{color:var(--ink);display:block;font-family:"Shippori Mincho",serif;font-size:18px;margin-bottom:6px;font-weight:600;}
  footer{border-top:1px solid var(--rule);padding:18px 20px 40px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--faint);letter-spacing:.04em;line-height:1.7;}
.leaflet-tile-pane{filter:grayscale(1) sepia(0.16) brightness(1.05) contrast(0.9);}
  #map{display:none;height:62vh;min-height:360px;margin:2px 12px 30px;border:1px solid var(--rule2);border-radius:6px;overflow:hidden;z-index:1;}
  .mapnote{padding:44px 20px;text-align:center;color:var(--muted);font-size:14px;}
  .basepin{width:26px;height:26px;border-radius:50%;background:var(--indigo);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);}
  .mapclose{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--indigo);background:var(--paper2);border:1px solid var(--rule2);border-radius:4px;padding:8px 12px;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.22);line-height:1;}
  .lh-right{display:flex;gap:14px;align-items:baseline;}
  .viewtoggle{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--indigo);background:none;border:0;cursor:pointer;letter-spacing:.04em;}
  .pop{font-family:"Zen Kaku Gothic New",sans-serif;font-size:13px;line-height:1.5;}
  .pop b{font-family:"Shippori Mincho",serif;font-size:15px;color:var(--ink);}
  .pjp{color:var(--faint);font-family:"Shippori Mincho",serif;}
  .pcat{font-family:"IBM Plex Mono",monospace;font-size:11px;}
  .leaflet-popup-content{margin:14px 15px;}
  .popbtns{display:flex;gap:8px;margin-top:13px;}
  .pbtn{flex:1;text-align:center;font-family:"Zen Kaku Gothic New",sans-serif;font-size:13px;font-weight:500;padding:11px 8px;border-radius:5px;cursor:pointer;text-decoration:none;line-height:1;white-space:nowrap;}
  .pdir{color:#fff!important;background:var(--indigo);border:1px solid var(--indigo);}
  .pclose{color:var(--muted);background:var(--paper2);border:1px solid var(--rule2);}
  .leaflet-container{font-family:"Zen Kaku Gothic New",sans-serif;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
  .notesbtn{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;color:rgba(231,227,217,.92);background:rgba(231,227,217,.12);border:1px solid rgba(231,227,217,.32);border-radius:5px;padding:6px 12px;cursor:pointer;}
  .notesbtn:hover{background:rgba(231,227,217,.2);}
  #notes{position:fixed;inset:0;z-index:3000;background:var(--paper);display:none;flex-direction:column;}
  #notes.open{display:flex;}
  .notes-head{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:1px solid var(--rule);background:var(--paper2);}
  .notes-head h2{font-family:"Shippori Mincho",serif;font-weight:700;font-size:20px;color:var(--ink);margin:0;}
  .notes-close{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--indigo);background:none;border:1px solid var(--rule2);border-radius:5px;padding:8px 12px;cursor:pointer;}
  .notes-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 18px 60px;overscroll-behavior:contain;}
  .acc{border-bottom:1px solid var(--rule);}
  .acc-h{width:100%;text-align:left;font-family:"Shippori Mincho",serif;font-weight:600;font-size:17px;color:var(--ink);padding:16px 2px;background:none;border:0;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .acc-h .chev{font-family:"IBM Plex Mono",monospace;color:var(--faint);transition:transform .15s;}
  .acc.open .acc-h .chev{transform:rotate(90deg);}
  .acc-c{display:none;padding:0 2px 18px;}
  .acc.open .acc-c{display:block;}
  .refrow{margin:0 0 13px;}
  .refrow b{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;font-size:14px;color:var(--ink);display:block;margin-bottom:1px;}
  .refrow .when{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);}
  .refrow p{font-family:"Zen Kaku Gothic New",sans-serif;font-size:14px;line-height:1.55;color:#3a352e;margin:3px 0 0;}
  .gfilter{width:100%;font-family:"Zen Kaku Gothic New",sans-serif;font-size:15px;padding:10px 12px;border:1px solid var(--rule2);border-radius:7px;background:var(--paper2);margin:2px 0 14px;color:var(--ink);box-sizing:border-box;}
  .grow{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule);}
  .grow .gt{font-family:"Shippori Mincho",serif;font-weight:600;font-size:14px;color:var(--ink);flex:0 0 33%;}
  .grow .gd{font-family:"Zen Kaku Gothic New",sans-serif;font-size:13.5px;line-height:1.5;color:#3a352e;flex:1;}
  .gempty{color:var(--muted);font-size:13px;padding:12px 0;}

5.7945}, {"n": "Murin-an", "jp": "無鄰菴", "cat": "Garden", "sub": "Meiji strolling garden, borrowed hills", "who": "Both", "km": 0.3, "closed": "", "price": "", "flags": [], "src": "Guido", "note": "Yamagata's garden, fed by the Biwa canal. Quiet where the temples are not; book ahead in autumn.", "url": "", "d": "Excursion · Kyoto (Higashiyama)", "code": "", "st": "", "mlat": 35.0116, "mlng": 135.7869, "approx": false, "lat": 35.0116, "lng": 135.7869}, {"n": "Kawai Kanjirō's House", "jp": "河井寛次郎記念館", "cat": "Art", "sub": "mingei potter's home & climbing kiln", "who": "Both", "km": 2.0, "closed": "Mon", "price": "", "flags": [], "src": "Guido", "note": "The reason to be in Kyoto for the two of you at once: hand-built joinery, the great noborigama kiln, almost no one there. Shut Mondays, so not the 27th.", "url": "", "d": "Excursion · Kyoto (Higashiyama)", "code": "", "st": "", "mlat": 34.9936, "mlng": 135.7744, "approx": false, "lat": 34.9936, "lng": 135.7744}, {"n": "Kyocera Museum of Art", "jp": "京都市京セラ美術館", "cat": "Art", "sub": "city art museum, Okazaki", "who": "Both", "km": 0.3, "closed": "Mon", "price": "", "flags": [], "src": "Guido", "note": "The 1933 building reworked with a glass wing, several shows at once. Closed Mondays.", "url": "", "d": "Excursion · Kyoto (Higashiyama)", "code": "", "st": "", "mlat": 35.0129, "mlng": 135.7836, "approx": false, "lat": 35.0129, "lng": 135.7836}, {"n": "MoMAK", "jp": "京都国立近代美術館", "cat": "Art", "sub": "modern art & crafts, Okazaki", "who": "Jon", "km": 0.3, "closed": "Mon", "price": "", "flags": [], "src": "Guido", "note": "The fourth-floor collection is the thing, strong on 20th-century ceramics. Across from the Kyocera. Closed Mondays.", "url": "", "d": "Excursion · Kyoto (Higashiyama)", "code": "", "st": "", "mlat": 35.0124, "mlng": 135.7822, "approx": false, "lat": 35.0124, "lng": 135.7822}, {"n": "Shōren-in", "jp": "青蓮院", "cat": "Temple", "sub": "temple, garden, evening light", "who": "Both", "km": 0.3, "closed": "", "price": "", "flags": [], "src": "Guido", "note": "Camphor trees older than the arguments about them. Empty in the morning; lantern-lit some autumn evenings.", "url": "", "d": "Excursion · Kyoto (Higashiyama)", "code": "", "st": "", "mlat": 35.0073, "mlng": 135.7832, "approx": false, "lat": 35.0073, "lng": 135.7832}, {"n": "Chion-in", "jp": "知恩院", "cat": "Temple", "sub": "Pure Land HQ, giant San-mon", "who": "Both", "km": 0.6, "closed": "", "price": "", "flags": [], "src": "Guido", "note": "The largest wooden gate in Japan and grounds wide enough to swallow the crowds. Just behind you.", "url": "", "d": "Excursion · Kyoto (Higashiyama)", "code": "", "st": "", "mlat": 35.0052, "mlng": 135.7834, "approx": false, "lat": 35.0052, "lng": 135.7834}, {"n": "Heian Shrine", "jp": "平安神宮", "cat": "Temple", "sub": "shrine & stroll garden", "who": "Both", "km": 0.7, "closed": "", "price": "", "flags": [], "src": "Guido", "note": "The vermilion is loud; the garden behind it is not. Minutes from the flat.", "url": "", "d": "Excursion · Kyoto (Higashiyama)", "code": "", "st": "", "mlat": 35.016, "mlng": 135.7824, "approx": false, "lat": 35.016, "lng": 135.7824}, {"n": "Yasaka Shrine", "jp": "八坂神社", "cat": "Temple", "sub": "Gion shrine, lantern nights", "who": "Both", "km": 0.9, "closed": "", "price": "", "flags": [], "src": "Guido", "note": "The hinge between Higashiyama and Gion, lit after dark. Maruyama Park runs off its back.", "url": "", "d": "Excursion · Kyoto (Higashiyama)", "code": "", "st": "", "mlat": 35.0037, "mlng": 135.7786, "approx": false, "lat": 35.0037, "lng": 135.7786}, {"n": "Maruyama Park", "jp": "円山公園", "cat": "Garden", "sub": "park behind Yasaka", "who": "Both", "km": 0.8, "closed": "", "price": "", "flags": [], "src": "Guido", "note": "Kyoto's oldest public park, its weeping cherry bare in October. A way through more than a destination.", "url": "", "d": "Excursion · Kyoto (Higashiyama)", "code": "", "st": "", "mlat": 35.0036, "mlng": 135.7805, "approx": false, "lat": 35.0036, "lng": 135.7805}, {"n": "Kōdai-ji", "jp": "高台寺", "cat": "Temple", "sub": "temple, gardens, small bamboo walk", "who": "Both", "km": 1.1, "closed": "", "price": "", "flags": [], "src": "Guido", "note": "Its own quiet bamboo path and one of the better autumn illuminations, if the dates fall your way.", "url": "", "d": "Excursion · Kyoto (Higashiyama)", "code": "", "st": "", "mlat": 35.0008, "mlng": 135.7813, "approx": false, "lat": 35.0008, "lng": 135.7813}, {"n": "Eikan-dō", "jp": "永観堂", "cat": "Temple", "sub": "the temple of maples", "who": "Both", "km": 1.1, "closed": "", "price": "", "flags": [], "src": "Guido", "note": "Green in late October, glorious a month on; the November illumination is the draw. Five minutes from Nanzen-ji.", "url": "", "d": "Excursion · Kyoto (Higashiyama)", "code": "", "st": "", "mlat": 35.0149, "mlng": 135.7942, "approx": false, "lat": 35.0149, "lng": 135.7942}, {"n": "Kiyomizu-dera", "jp": "清水寺", "cat": "Temple", "sub": "hillside stage, Higashiyama", "who": "Both", "km": 1.7, "closed": "", "price": "", "flags": [], "src": "Guido", "note": "Unmissable and mobbed. Opening at six or last light; the approach lanes are both the pleasure and the crush.", "url": "", "d": "Excursion · Kyoto (Higashiyama)", "code": "", "st": "", "mlat": 34.9947, "mlng": 135.7847, "approx": false, "lat": 34.9947, "lng": 135.7847}, {"n": "Philosopher's Path", "jp": "哲学の道", "cat": "Landmark", "sub": "canal walk, Ginkaku-ji to Nanzen-ji", "who": "Both", "km": 1.6, "closed": "", "price": "", "flags": [], "src": "Guido", "note": "Two kilometres of canal under the cherries, Hōnen-in a quiet detour off it. Walk it north from Nanzen-ji.", "url": "", "d": "Excursion · Kyoto (Higashiyama)", "code": "", "st": "", "mlat": 35.0215, "mlng": 135.7943, "approx": false, "lat": 35.0215, "lng": 135.7943}, {"n": "Funaoka Onsen", "jp": "船岡温泉", "cat": "Onsen", "sub": "historic timber sentō", "who": "Dave", "km": 4.6, "closed": "Tue", "price": "", "flags": [], "src": "Guido", "note": "Dave's bath and your woodwork at once: carved ranma, Meiji tilework, an outdoor tub. Northwest of centre, worth the trip. Shut Tuesdays.", "url": "", "d": "Excursion · Kyoto (Higashiyama)", "code": "", "st": "", "mlat": 35.037, "mlng": 135.7447, "approx": false, "lat": 35.037, "lng": 135.7447}, {"n": "Nishiki Market", "jp": "錦市場", "cat": "Market", "sub": "covered market, 'Kyoto's kitchen'", "who": "Both", "km": 1.8, "closed": "", "price": "", "flags": [], "src": "Guido", "note": "Five narrow blocks of pickles, tofu and knives. Touristy now, still the real thing early. Cash.", "url": "", "d": "Excursion · Kyoto (Higashiyama)", "code": "", "st": "", "mlat": 35.005, "mlng": 135.7647, "approx": false, "lat": 35.005, "lng": 135.7647}, {"n": "Iwatayama Monkey Park", "jp": "嵐山モンキーパークいわたやま", "cat": "Landmark", "sub": "macaques above Arashiyama", "who": "Dave", "km": 9.8, "closed": "", "price": "", "flags": [], "src": "Guido", "note": "Where Dave's colleague works: wild Japanese macaques, a stiff twenty-minute climb, the city spread below. The Arashiyama anchor for the 26th.", "url": "", "d": "Excursion · Kyoto (Higashiyama)", "code": "", "st": "", "mlat": 35.0114, "mlng": 135.6766, "approx": false, "lat": 35.0114, "lng": 135.6766}, {"n": "Tenryū-ji", "jp": "天龍寺", "cat": "Temple", "sub": "Zen temple, Sōgen-chi garden", "who": "Both", "km": 10.0, "closed": "", "price": "", "flags": [], "src": "Guido", "note": "The garden that borrows the Arashiyama hills whole. The bamboo grove runs from its north gate.", "url": "", "d": "Excursion · Kyoto (Higashiyama)", "code": "", "st": "", "mlat": 35.0158, "mlng": 135.6738, "approx": false, "lat": 35.0158, "lng": 135.6738}, {"n": "Arashiyama Bamboo Grove", "jp": "竹林の小径", "cat": "Landmark", "sub": "the bamboo path", "who": "Both", "km": 10.3, "closed": "", "price": "", "flags": [], "src": "Guido", "note": "Famous, brief, best at dawn. Ōkōchi Sansō's garden at the far end repays the few who pay in.", "url": "", "d": "Excursion · Kyoto (Higashiyama)", "code": "", "st": "", "mlat": 35.0168, "mlng": 135.6713, "approx": false, "lat": 35.0168, "lng": 135.6713}, {"n": "Okutan Nanzenji", "jp": "奥丹 南禅寺", "cat": "Food", "sub": "yudofu (tofu) since Edo", "who": "Both", "km": 0.9, "closed": "", "price": "", "flags": [], "src": "Guido", "note": "Tofu as an occasion, in an old house by Nanzen-ji. Set menu, shoes off, cash. Nothing here to trouble the egg question.", "url": "", "d": "Excursion · Kyoto (Higashiyama)", "code": "", "st": "", "mlat": 35.0123, "mlng": 135.793, "approx": false, "lat": 35.0123, "lng": 135.793}, {"n": "Hinode Udon", "jp": "日の出うどん", "cat": "Food", "sub": "udon, famed curry udon", "who": "Both", "km": 1.1, "closed": "Sun", "price": "", "flags": [], "src": "Guido", "note": "The curry udon off the Philosopher's Path that people queue for. Half-portions exist. Cash, shut Sundays, so not the 26th.", "url": "", "d": "Excursion · Kyoto (Higashiyama)", "code": "", "st": "", "mlat": 35.0164, "mlng": 135.7936, "approx": false, "lat": 35.0164, "lng": 135.7936}, {"n": "Omen Ginkakuji", "jp": "おめん 銀閣寺", "cat": "Food", "sub": "handmade dip-udon", "who": "Both", "km": 2.1, "closed": "Thu", "price": "", "flags": [], "src": "Guido", "note": "Dip-style udon near Ginkaku-ji, the seasoning box half the fun. Closed Thursdays.", "url": "", "d": "Excursion · Kyoto (Higashiyama)", "code": "", "st": "", "mlat": 35.0263, "mlng": 135.795, "approx": false, "lat": 35.0263, "lng": 135.795}, {"n": "Kasagiya", "jp": "かさぎ屋", "cat": "Food", "sub": "tea house, red-bean mochi", "who": "Both", "km": 1.4, "closed": "Tue", "price": "", "flags": [], "src": "Guido", "note": "Four tables on the Kiyomizu approach, unchanged for a century. Zenzai and grilled mochi. Shut Tuesdays.", "url": "", "d": "Excursion · Kyoto (Higashiyama)", "code": "", "st": "", "mlat": 34.9981, "mlng": 135.7808, "approx": false, "lat": 34.9981, "lng": 135.7808}, {"n": "% Arabica Higashiyama", "jp": "アラビカ京都 東山", "cat": "Coffee", "sub": "espresso under the pagoda", "who": "Jon", "km": 1.4, "closed": "", "price": "", "flags": [], "src": "Guido", "note": "The view is Yasaka Pagoda, the latte very good, the queue real. Small. Yours, not Dave's.", "url": "", "d": "Excursion · Kyoto (Higashiyama)", "code": "", "st": "", "mlat": 34.9986, "mlng": 135.7783, "approx": false, "lat": 34.9986, "lng": 135.7783}, {"n": "Kagizen Yoshifusa", "jp": "鍵善良房", "cat": "Food", "sub": "kuzukiri, Gion tea house", "who": "Both", "km": 1.1, "closed": "Mon", "price": "", "flags": [], "src": "Guido", "note": "Kuzukiri lifted from iced water into black syrup, a small ceremony. Gion. Closed Mondays.", "url": "", "d": "Excursion · Kyoto (Higashiyama)", "code": "", "st": "", "mlat": 35.004, "mlng": 135.7747, "approx": false, "lat": 35.004, "lng": 135.7747}, {"n": "Honke Owariya", "jp": "本家尾張屋", "cat": "Food", "sub": "soba, five centuries on", "who": "Both", "km": 2.2, "closed": "", "price": "", "flags": [], "src": "Guido", "note": "Fifteen generations of soba; the hōrai-soba a stack of little plates. Lunch only, queue early.", "url": "", "d": "Excursion · Kyoto (Higashiyama)", "code": "", "st": "", "mlat": 35.0128, "mlng": 135.7601, "approx": false, "lat": 35.0128, "lng": 135.7601}, {"n": "Ippodo Tea", "jp": "一保堂茶舗", "cat": "Coffee", "sub": "tea house & tasting room", "who": "Both", "km": 1.6, "closed": "", "price": "", "flags": [], "src": "Guido", "note": "Three centuries of tea; sit in the Kaboku room and have them pour you a koicha. Downtown, near Owariya.", "url": "", "d": "Excursion · Kyoto (Higashiyama)", "code": "", "st": "", "mlat": 35.0145, "mlng": 135.7674, "approx": false, "lat": 35.0145, "lng": 135.7674}];
const DISTRICTS=["1 · Asakusa & Minowa", "2 · The tram (Sugamo & Zōshigaya)", "3 · Kōrakuen & Tokyo Dome", "4 · Kiyosumi-Shirakawa", "5 · Kanda, Jimbōchō & Imperial Palace", "6 · Ginza & the bayside", "7 · Omotesandō, Aoyama & Harajuku", "8 · Shinjuku", "9 · Shimokitazawa & Setagaya", "10 · Kōenji", "11 · Nakano", "12 · Meguro & Nakameguro", "13 · Kichijōji & the far west", "Others & further afield", "Excursion · Kyoto (Higashiyama)"];
const REF={"glossary": [["Aka-shari", "Sushi rice seasoned with red vinegar from aged sake lees; browner, sweeter, more umami than white-vinegar rice."], ["Buta no kakuni", "Pork belly simmered slowly in soy, sake and sugar until it falls apart."], ["Dorayaki", "Two little pancakes sandwiching sweet red-bean paste."], ["Edomae", "The old Tokyo style of sushi, often cured or aged rather than served raw and cold."], ["Gyoza", "Pan-fried pork-and-cabbage dumplings, crisp on one side."], ["Hayashi rice", "Beef, onion and mushroom in a thick demi-glace over rice; a Japanese idea of a Western dish."], ["Izakaya", "A pub that serves food, eaten as shared small plates over drinks."], ["Kaitenzushi", "Conveyor-belt sushi, billed by the plate."], ["Karaage", "Japanese fried chicken: marinated, coated and deep-fried."], ["Kare", "Japanese curry: a mild, thick, faintly sweet sauce, usually over rice."], ["Mābō / mapo tofu", "Tofu and minced pork in a spicy Sichuan-style sauce."], ["Monaka", "A crisp wafer shell filled with sweet bean paste."], ["Napolitan", "Ketchup-based spaghetti with sausage and peppers, a Shōwa-era Western dish."], ["Oden", "Daikon, egg, tofu and fishcakes simmered in a light dashi broth."], ["Okonomiyaki", "A savoury cabbage pancake griddled with meat or seafood; the Hiroshima style layers in noodles."], ["Omurice", "A thin omelette folded over ketchup fried rice."], ["Onigiri", "A hand-formed rice ball, usually filled and wrapped in nori."], ["Otōshi", "The small charged appetiser brought automatically at an izakaya, in effect a cover charge."], ["Ramen", "Wheat noodles in broth, from light shio and shoyu to rich tonkotsu and miso."], ["Shime", "The final carb-heavy dish that closes a night of drinking."], ["Shiodaifuku", "A soft mochi rice cake filled with bean paste and lightly salted."], ["Shōgayaki", "Pork fried with ginger, a home-style favourite."], ["Soba", "Thin buckwheat noodles, hot in broth or cold with a dipping sauce."], ["Sushi (nigiri)", "A hand-pressed finger of vinegared rice topped with fish or shellfish."], ["Taiyaki", "A fish-shaped cake filled with bean paste or custard."], ["Tanmen", "A mild salt-based ramen piled with stir-fried vegetables and pork."], ["Tantanmen", "The Japanese take on Sichuan dan dan noodles: sesame, chilli, ground pork."], ["Tebasaki", "Chicken wings, Nagoya-style twice-fried and peppered."], ["Teishoku", "A set meal: a main plus rice, miso soup, pickles and small sides."], ["Tempura", "Seafood and vegetables in a light batter, deep-fried."], ["Tonkatsu", "A crumbed, deep-fried pork cutlet, usually served as a teishoku."], ["Tsukemen", "'Dipping' ramen: cool noodles dipped into a separate bowl of concentrated hot broth."], ["Udon", "Thick, chewy wheat noodles; Sanuki udon is the firm benchmark."], ["Unagi", "Freshwater eel, grilled with a sweet soy glaze; a Taitō-ku speciality."], ["Wagashi", "Traditional sweets of bean paste, mochi and seasonal shapes, made to go with tea."], ["Yakiniku", "Bite-size beef and offal grilled by you over charcoal at the table."], ["Yakitori", "Charcoal-grilled chicken skewers, salt (shio) or sweet soy glaze (tare)."], ["Yakiton", "The pork version of yakitori."], ["Yōshoku", "Japanese-Western food: omurice, hayashi rice, Napolitan, korokke."]], "etiquette": [["Closed days", "Most museums close Monday (Tokyo National, TOP, Nezu, the Film Archive, Kakimori). The National Art Center closes Tuesday instead. Kiyosumi Garden is open daily. In Kyoto, Kawai Kanjirō's House and both Okazaki museums also shut Mondays, so keep the 27th for temples and wandering."], ["Flea markets", "A lottery on a short trip: mostly monthly, shrine-based, clustered on Sundays. The big Ōedo market falls 4 and 31 Oct 2026, both just outside your stay. Your one realistic Tokyo Sunday is the 25th; Tomioka Hachiman, Hanazono and Nogi hold markets on set Sundays but dates drift, so confirm the week."], ["Getting in", "Many small places seat you: wait at the door. A noren curtain up means open, down means closed. Popular shops use a paper waiting-list or a ticket machine. Counter seats are the good seats at ramen, sushi, tempura and yakitori."], ["Ordering", "Four systems: ticket machine (buy first, coins and small notes), table tablet (English top-right), verbal at the counter (point, or say the dish + 'kudasai'; 'osusume wa?' = what do you recommend), and plastic food models you can point at."], ["Once seated", "An oshibori towel is for your hands. Otōshi (a small charged appetiser, ¥300–600) is a cover charge, not a scam. Slurp noodles; lift the rice bowl. Never stand chopsticks upright in rice or pass food chopstick-to-chopstick. Pour for each other."], ["Street & standing", "Don't walk and eat; eat beside the stall. Tachinomi (standing bars) are for a drink and a few plates, then making room. Konbini food is fine at the counter shelf or in a park."], ["Paying", "Pay at the register on the way out; take your slip. Cash is king at small and old shops; carry more than you think. Notes on the tray, not the hand. No tipping."], ["Timing the trip", "Oct 19–30 falls outside any major holiday, so no widespread closures. Late October: Tokyo's maples only begin to turn in the last week, and Kyoto's eastern hills are still green (peak is mid-to-late November), so come for the temples, the streets and the empty mornings rather than the colour."], ["Baseball", "Your dates land on the NPB post-season: the Japan Series runs Oct 24 – Nov 1. Grounds depend on the standings; tickets go on sale once matchups are set, sell fast, via the host club and Lawson Ticket. Decide nearer the time."]], "transport": [["IC card", "One Suica or Pasmo covers Metro, JR, the Toden tram, buses and konbini, in Tokyo and Kansai. On iPhone, add Suica to Apple Wallet (five minutes, no deposit). Otherwise a Welcome Suica or Tourist Pasmo at the airport, or a regular Suica (¥500 deposit) from a machine."], ["Your line", "Minowa is on the Hibiya line (H-19), which runs straight through Ueno, Akihabara, Ginza, Roppongi and Ebisu to Naka-Meguro. Most of the trip, no change."], ["The tram", "The Toden Arakawa tram (Tokyo Sakura Tram) from Minowabashi handles the north-west wards, and is a photograph in itself."], ["West side", "Shimokitazawa and Kōenji mean one change, onto the JR Chūō or the Odakyū/Keiō lines. Allow ~45 min."], ["Routing", "Google Maps handles Tokyo transit to the platform and the fare. Tabelog is more reliable than Google for small-restaurant hours."], ["Manners", "Trains are quiet (no calls). Queue on the platform marks; stand left on escalators in Tokyo, right in Osaka. A 10am start clears the 7.30–9 crush."], ["To Kyoto", "Tokyo to Kyoto is the Tōkaidō Shinkansen: Nozomi about 2h15 (not covered by the JR Pass), Hikari a little slower but pass-eligible. From Kyoto Station, the Karasuma then Tōzai subway reaches Higashiyama Station, the cleanest way into Okazaki with luggage; the sightseeing buses are scenic but slow at peak."], ["In Kyoto", "Higashiyama is walking country. The Tōzai subway (Higashiyama, Keage) is your spine; city buses 5, 100 and 46 cover the sights but clog at peak. An IC card works on all of it."], ["Payment", "Cash is still king at small and old shops; several here are cash-only. Put notes on the till tray, not into a hand. No tipping, anywhere."]], "cinema": [["How it works", "", "Foreign films screen in the original with Japanese subtitles, watchable. Pick the 字幕 (subtitled) screening, not 吹替 (dubbed). Japanese films with English subtitles are rare outside festivals."], ["Tokyo International Film Festival", "26 Oct – 4 Nov 2026, Hibiya–Yūrakuchō–Ginza", "Overlaps your last five days, a short Hibiya-line ride away. Screens world and Japanese cinema with English and Japanese subtitles as standard. Book on the festival site once the programme lands."], ["Mizoguchi retrospective", "~27 Oct – 1 Nov, National Film Archive, Kyōbashi", "TIFF/NFAJ Classics: Mizoguchi on a big screen, subtitled, beside the Ginza cluster. Closed Mondays."], ["Waseda Shōchiku", "Takadanobaba", "A fifty-year-old repertory house, 35mm double bills."], ["Eurospace", "Shibuya", "Arthouse and world cinema."], ["Image Forum", "Shibuya", "Experimental and avant-garde, with its own festival."], ["Bunkamura Le Cinéma", "Shibuya — CLOSED", "Shut for redevelopment; ignore older guides that list it."], ["Mainstream", "TOHO Cinemas (Ueno, Roppongi)", "For a film on a wet evening; check for the 字幕 screening."]], "chains": [["Ichiran", "Ramen", "Individual booths, one tonkotsu broth, many 24-hour branches; a solitary eat-and-go."], ["Ippudo", "Ramen", "Several broths, normal tables, better if you want to talk. Try it against Ichiran."], ["Tenka Ippin", "Ramen", "Kyoto-founded, chicken broth near gravy; polarising, less known to foreigners."], ["Afuri", "Ramen", "Yuzu-forward, bright and light, with a rare vegan option; the Ebisu original is open until 5am."], ["Sushiro", "Sushi", "The biggest and cheapest, from 120 yen."], ["Kura", "Sushi", "Comparable to Sushiro, with tablets that switch to English and app booking."], ["Sushizanmai", "Sushi", "Smaller, better, dearer, tuna-focused; Tsukiji and Roppongi branches open 24h, the answer to 4am jet lag."], ["Fuji Soba", "Noodles", "24 hours: soba, udon, tempura, rice bowls. Cheap and everywhere."], ["Ootoya", "Teishoku", "Set meals, 200 branches, reasonable."], ["Torikizoku", "Yakitori", "370 yen for two skewers, English menu, ~200 Tokyo branches; long lines at peak."], ["Sekai no Yamachan", "Tebasaki", "Nagoya twice-fried wings and cold beer; snap the wing and pull the meat off in one."], ["FuRaiBo", "Tebasaki", "The other famous Nagoya wings chain."]]};
const BASE={lat:35.7284422,lng:139.7910939,label:"Minowa \u00b7 Hibiya H-19"};
const AREABASE={"Excursion \u00b7 Kyoto (Higashiyama)":{lat:35.0102,lng:135.7839,label:"Higashiyama \u00b7 Okazaki"}};
function areaBase(){ return AREABASE[state.district]||BASE; }
const CATHEX={Food:"#4B463D",Coffee:"#8A5A38",Art:"#2B3E5C",Garden:"#5F7145",Woodworking:"#9B4A34",
  Shop:"#6E5470",Market:"#9A7B2E",Cinema:"#6B4E6E",Baseball:"#4F6D80",Onsen:"#4E8299",Temple:"#5E6A73",Landmark:"#8A837A"};
const CATORDER=["Food","Coffee","Art","Garden","Woodworking","Shop","Market","Cinema","Baseball","Onsen","Temple","Landmark"];
const LINE={H:["#B5B5AC","#1C1813"],G:["#FF9500","#1C1813"],A:["#E85298","#fff"],E:["#CE045B","#fff"],
  C:["#00BB85","#fff"],M:["#F62E36","#fff"],Z:["#8F76D6","#fff"],JY:["#9ACD32","#1C1813"]};
const DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const FULL={Sun:"Sunday",Mon:"Monday",Tue:"Tuesday",Wed:"Wednesday",Thu:"Thursday",Fri:"Friday",Sat:"Saturday"};
const today=DAYS[new Date().getDay()];
const FLAGLABEL={reserve:"reserve","cash-only":"cash",egg:"\u25C6\uFE0E egg",avoid:"\u2715\uFE0E avoid",
  free:"free",standing:"standing",tram:"tram","24h":"24h",seasonal:"seasonal"};
const TRIP=[["Mon","19"],["Tue","20"],["Wed","21"],["Thu","22"],["Fri","23"],["Sat","24"],["Sun","25"],["Mon","26"],["Tue","27"],["Wed","28"],["Thu","29"],["Fri","30"]];
let state={district:DISTRICTS[0],interest:"all",cats:new Set(CATORDER),open:false,q:"",sort:"dist",day:today,dayLabel:"Today",view:"list"};

function closedToday(it){ return it.closed && it.closed.split(/[,\s]+/).includes(state.day); }
function matchInterest(it){ if(state.interest==="all")return true;
  if(state.interest==="jon")return it.who==="Jon"||it.who==="Both"; return it.who==="Dave"||it.who==="Both"; }
function dirLink(it){ const AB=AREABASE[it.d]||BASE; const d=(it.lat&&it.lng)?(it.lat+","+it.lng):encodeURIComponent(it.n);
  return "https://www.google.com/maps/dir/?api=1&origin="+AB.lat+","+AB.lng+"&destination="+d+"&travelmode=walking"; }
function stationBadge(it){
  if(it.code){ const col=LINE[it.code.split("-")[0]]||["#8A837A","#fff"];
    return '<span class="stn"><span class="code" style="background:'+col[0]+';color:'+col[1]+'">'+it.code+'</span>'+(it.st?'<span class="stnm">'+it.st+'</span>':'')+'</span>'; }
  if(it.st){ return '<span class="stn"><span class="code plain">'+it.st+'</span></span>'; }
  return ""; }

let map=null, markerLayer=null;
window.__closePop=function(){ if(map) map.closePopup(); };
function currentItems(){
  let items=DATA.filter(it=> (state.district==="__ALL__" ? it.d.indexOf("Excursion")!==0 : it.d===state.district) && matchInterest(it) && state.cats.has(it.cat) && (!state.open||!closedToday(it)));
  if(state.q){ const q=state.q.toLowerCase(); items=items.filter(it=>(it.n+" "+it.jp+" "+it.sub+" "+it.note).toLowerCase().includes(q)); }
  items.sort((a,b)=>{ if(state.sort==="cat"){ const c=CATORDER.indexOf(a.cat)-CATORDER.indexOf(b.cat); if(c)return c; }
    const ak=a.km==null?Infinity:a.km, bk=b.km==null?Infinity:b.km; return ak-bk; });
  return items;
}
function refresh(){ if(state.view==="map") renderMap(); else render(); }
function renderMap(){
  const items=currentItems();
  document.getElementById("count").textContent=items.length+" place"+(items.length===1?"":"s")+" \u00b7 map";
  const el=document.getElementById("map");
  if(typeof L==="undefined"){ el.innerHTML='<div class="mapnote">Map is loading\u2026</div>'; return; }
  if(!map){
    map=L.map(el,{zoomControl:true,closePopupOnClick:false}).setView([BASE.lat,BASE.lng],14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{subdomains:'abc',maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
    markerLayer=L.layerGroup().addTo(map);
    const ListCtl=L.Control.extend({options:{position:'topright'},onAdd:function(){var d=L.DomUtil.create('button','mapclose');d.type='button';d.innerHTML='\u2630 List';L.DomEvent.on(d,'click',function(e){L.DomEvent.stop(e);document.getElementById('viewtoggle').click();});return d;}});
    map.addControl(new ListCtl());
  }
  markerLayer.clearLayers();
  const pts=[];
  const AB=areaBase();
  const base=L.marker([AB.lat,AB.lng],{icon:L.divIcon({className:'',html:'<div class="basepin">\u2302</div>',iconSize:[26,26],iconAnchor:[13,13]}),zIndexOffset:1000}).bindPopup('<div class="pop"><b>Your base</b><br>'+AB.label+'<div class="popbtns"><button type="button" class="pbtn pclose" onclick="__closePop()">Close</button></div></div>',{closeButton:false,minWidth:150});
  markerLayer.addLayer(base);
  items.forEach(it=>{
    if(it.mlat==null||it.mlat===undefined) return;
    const col=CATHEX[it.cat]||"#4B463D";
    const m=L.circleMarker([it.mlat,it.mlng],{radius:8,color:"#fff",weight:2,fillColor:col,fillOpacity:0.9});
    const km=it.km!=null?(it.km.toFixed(1)+' km \u00b7 '):'';
    const stn=it.st?(it.approx?('near '+it.st):it.st):'';
    m.bindPopup('<div class="pop"><b>'+it.n+'</b>'+(it.jp?' <span class="pjp">'+it.jp+'</span>':'')+'<br><span class="pcat" style="color:'+col+'">'+it.cat+'</span> \u00b7 '+km+stn+'<div class="popbtns"><a class="pbtn pdir" href="'+dirLink(it)+'" target="_blank" rel="noopener">Directions \u2197\uFE0E</a><button type="button" class="pbtn pclose" onclick="__closePop()">Close</button></div></div>',{closeButton:false,minWidth:190});
    markerLayer.addLayer(m); pts.push([it.mlat,it.mlng]);
  });
  if(pts.length){ map.fitBounds(pts,{padding:[40,40],maxZoom:16}); } else { const A=areaBase(); map.setView([A.lat,A.lng],14); }
  setTimeout(function(){ map.invalidateSize(); },60);
}
function buildChips(){ const box=document.getElementById("chips");
  CATORDER.forEach(cat=>{ const b=document.createElement("button");
    b.className="chip"; b.setAttribute("aria-pressed","true"); b.dataset.cat=cat;
    b.innerHTML='<span class="cdot" style="background:'+CATHEX[cat]+'"></span>'+cat;
    b.onclick=()=>{ const on=b.getAttribute("aria-pressed")==="true"; b.setAttribute("aria-pressed",on?"false":"true");
      if(on)state.cats.delete(cat); else state.cats.add(cat); refresh(); };
    box.appendChild(b); }); }

function updatePlaceholder(){ var el=document.getElementById("search"); if(!el)return; el.placeholder = state.district==="__ALL__" ? "Search all areas\u2026" : (state.district.indexOf("Kyoto")>=0 ? "Search Higashiyama\u2026" : "Search this area\u2026"); }
function updateToday(){ const all=state.district==="__ALL__"; const inD=DATA.filter(x=> all ? x.d.indexOf("Excursion")!==0 : x.d===state.district); const shut=inD.filter(closedToday).length;
  const dname = state.dayLabel==="Today" ? FULL[state.day] : state.dayLabel+" Oct";
  let msg="<b>"+dname+".</b> ";
  if(state.day==="Mon") msg+='<span class="warn">Mondays close most museums and many shops.</span> ';
  msg += shut ? (shut+(all?" across town ":" here ")+(shut===1?"is":"are")+" closed.") : (all?"Everything\u2019s open across town.":"Everything here is open.");
  document.getElementById("today").innerHTML=msg; }
function setToggleLabel(){ document.getElementById("openToggle").innerHTML='<span class="dot"></span>Open '+(state.dayLabel==="Today"?"today":state.dayLabel); }
function buildDays(){ const box=document.getElementById("daybar");
  const chips=[["Today",today]].concat(TRIP.map(function(t){return [t[0]+" "+t[1],t[0]];}));
  chips.forEach(function(c){ var lab=c[0],day=c[1]; var b=document.createElement("button");
    b.className="day"; b.setAttribute("aria-pressed", lab===state.dayLabel?"true":"false"); b.textContent=lab;
    b.onclick=function(){ document.querySelectorAll(".day").forEach(function(x){x.setAttribute("aria-pressed","false");});
      b.setAttribute("aria-pressed","true"); state.day=day; state.dayLabel=lab; setToggleLabel(); updateToday(); refresh(); };
    box.appendChild(b); }); }

function render(){
  const items=currentItems();
  document.getElementById("count").textContent=items.length+" place"+(items.length===1?"":"s")+" · "+(state.sort==="dist"?"nearest first":"by category");
  const list=document.getElementById("list"); list.innerHTML="";
  if(!items.length){ list.innerHTML='<div class="empty"><b>Nothing matches</b>Try turning a category back on, or clearing the search.</div>'; return; }
  items.forEach(it=>{ const li=document.createElement("li"); const shut=closedToday(it);
    li.className="card"+(shut?" closed":"");
    const flags=(it.flags||[]).map(f=>'<span class="fl '+(f==="avoid"?"avoid":"")+'">'+(FLAGLABEL[f]||f)+'</span>').join("");
    const closedTag=shut?'<span class="fl closedt">closed '+state.day+'</span>':"";
    const kmTag=(it.km!=null)?'<span>'+it.km.toFixed(1)+' km</span>':"";
    const priceTag=it.price?'<span>'+it.price+'</span>':"";
    li.innerHTML='<div class="spine" style="background:'+(CATHEX[it.cat]||"#4B463D")+'"></div><div class="body">'+
      '<button class="head" aria-expanded="false"><span class="nl"><span class="nm">'+it.n+'</span>'+(it.jp?'<span class="jp">'+it.jp+'</span>':'')+'<span class="caret">\u203A\uFE0E</span></span>'+
      '<div class="meta"><span class="cat" style="color:'+(CATHEX[it.cat]||"#4B463D")+'">'+it.cat+'</span>'+kmTag+stationBadge(it)+priceTag+closedTag+flags+'</div>'+
      '<p class="desc">'+it.note+'</p></button>'+
      '<div class="detail" hidden><div class="drow"><b>'+it.sub+'</b> · for '+it.who+' · source: '+it.src+'</div>'+
      '<div class="links"><a href="'+dirLink(it)+'" target="_blank" rel="noopener">Directions <span class="ext">\u2197\uFE0E</span></a>'+
      (it.url?'<a class="ghost" href="'+it.url+'" target="_blank" rel="noopener">Website <span class="ext">\u2197\uFE0E</span></a>':'')+'</div></div></div>';
    const head=li.querySelector(".head"), det=li.querySelector(".detail");
    head.onclick=()=>{ const open=li.classList.toggle("open"); det.hidden=!open; head.setAttribute("aria-expanded",open?"true":"false"); };
    list.appendChild(li); });
}

const sel=document.getElementById("district");
sel.innerHTML='<option value="__ALL__">All areas \u00b7 Tokyo</option>'+DISTRICTS.map(d=>'<option value="'+d.replace(/"/g,'&quot;')+'">'+d+'</option>').join(""); sel.value=state.district;
sel.onchange=()=>{ state.district=sel.value; updateToday(); updatePlaceholder(); refresh(); };
document.querySelectorAll(".seg button").forEach(b=>{ b.onclick=()=>{ document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed","false"));
  b.setAttribute("aria-pressed","true"); state.interest=b.dataset.int; refresh(); }; });
const ot=document.getElementById("openToggle");
ot.onclick=()=>{ const on=ot.getAttribute("aria-pressed")==="true"; ot.setAttribute("aria-pressed",on?"false":"true"); state.open=!on; refresh(); };
document.getElementById("search").oninput=e=>{ state.q=e.target.value.trim(); refresh(); };
document.getElementById("sort").onclick=e=>{ state.sort=state.sort==="dist"?"cat":"dist";
  e.target.textContent=state.sort==="dist"?"sort · nearest ⇅︎":"sort · category \u21C5\uFE0E"; refresh(); };

document.getElementById("viewtoggle").onclick=function(){
  state.view = state.view==="map"?"list":"map";
  const on = state.view==="map";
  document.getElementById("map").style.display = on?"block":"none";
  document.getElementById("list").style.display = on?"none":"block";
  document.getElementById("sort").style.display = on?"none":"inline";
  this.textContent = on?"\u2630 Show list":"\u25F1 View map";
  refresh();
};
function refRow(topic,detail,when){ return '<div class="refrow"><b>'+topic+'</b>'+(when?'<span class="when">'+when+'</span>':'')+(detail?'<p>'+detail+'</p>':'')+'</div>'; }
function accBlock(title,inner,open){ return '<div class="acc'+(open?' open':'')+'"><button class="acc-h">'+title+'<span class="chev">›</span></button><div class="acc-c">'+inner+'</div></div>'; }
function buildNotes(){
  var b=document.getElementById("notesBody"); if(!b) return;
  var g='<input class="gfilter" id="gfilter" type="search" placeholder="Filter terms…" autocomplete="off"><div id="glist">'+REF.glossary.map(function(x){return '<div class="grow" data-t="'+(x[0]+" "+x[1]).toLowerCase().replace(/"/g,"")+'"><span class="gt">'+x[0]+'</span><span class="gd">'+x[1]+'</span></div>';}).join("")+'</div>';
  var eat=REF.etiquette.map(function(x){return refRow(x[0],x[1]);}).join("");
  var trans=REF.transport.map(function(x){return refRow(x[0],x[1]);}).join("");
  var cin=REF.cinema.map(function(x){return refRow(x[0],x[2],x[1]);}).join("");
  var ch=REF.chains.map(function(x){return refRow(x[0],x[2],x[1]);}).join("");
  b.innerHTML=accBlock("Glossary",g,true)+accBlock("Eating & etiquette",eat)+accBlock("Getting around",trans)+accBlock("Cinema",cin)+accBlock("Chains",ch);
  b.querySelectorAll(".acc-h").forEach(function(h){ h.onclick=function(){ h.parentNode.classList.toggle("open"); }; });
  var gf=document.getElementById("gfilter");
  if(gf){ gf.oninput=function(){ var q=gf.value.toLowerCase(); var any=false;
    document.querySelectorAll("#glist .grow").forEach(function(r){ var m=r.getAttribute("data-t").indexOf(q)>=0; r.style.display=m?"flex":"none"; if(m)any=true; });
    var e=document.getElementById("gempty");
    if(!any){ if(!e){ e=document.createElement("div"); e.id="gempty"; e.className="gempty"; e.textContent="No term matches."; document.getElementById("glist").appendChild(e);} }
    else if(e){ e.remove(); }
  }; }
}
document.getElementById("notesBtn").onclick=function(){ document.getElementById("notes").classList.add("open"); document.getElementById("notesBody").scrollTop=0; };
document.getElementById("notesClose").onclick=function(){ document.getElementById("notes").classList.remove("open"); };
document.addEventListener("keydown",function(e){ if(e.key==="Escape") document.getElementById("notes").classList.remove("open"); });
buildChips(); buildDays(); setToggleLabel(); updateToday(); updatePlaceholder(); buildNotes(); refresh();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
